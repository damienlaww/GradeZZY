<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="990" viewBox="0 0 1760 990" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="nav" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,6 L0,12" fill="none" stroke="#24292f" stroke-width="1.5"/>
    </marker>
    <marker id="comp" markerWidth="20" markerHeight="12" refX="1" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,6 L9,1 L17,6 L9,11 Z" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
    </marker>
    <style>
      .cls { fill: #ffffff; stroke: #24292f; stroke-width: 1.3; }
      .enum { fill: #eef4ff; stroke: #24292f; stroke-width: 1.3; }
      .cname { font-size: 15px; font-weight: 600; fill: #24292f; }
      .stereo { font-size: 11px; fill: #57606a; }
      .at { font-size: 13px; fill: #24292f; }
      .mult { font-size: 13px; fill: #24292f; }
      .role { font-size: 12px; font-style: italic; fill: #57606a; }
      .note { font-size: 12px; font-style: italic; fill: #57606a; }
      .line { fill: none; stroke: #24292f; stroke-width: 1.4; }
      .sep { stroke: #24292f; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1760" height="990" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#24292f">Domain model</text>
  <text x="40" y="66" class="note">UML class diagram of the model package: what one grading run holds. Getters and setters are not shown.</text>
  <line x1="1250" y1="36" x2="1310" y2="36" class="line" marker-start="url(#comp)"/>
  <text x="1320" y="40" class="at">is made of (composition)</text>
  <line x1="1250" y1="60" x2="1310" y2="60" class="line" marker-end="url(#nav)"/>
  <text x="1320" y="64" class="at">refers to</text>
  <rect x="1520" y="26" width="24" height="16" class="enum"/>
  <text x="1552" y="40" class="at">enum</text>

  <!-- Column A -->
  <rect x="60" y="100" width="320" height="132" class="cls"/>
  <text x="220" y="122" class="cname" text-anchor="middle">GradingRun</text>
  <line x1="60" y1="130" x2="380" y2="130" class="sep"/>
  <text x="70" y="150" class="at">- id : String</text>
  <text x="70" y="168" class="at">- startedAt : LocalDateTime</text>
  <text x="70" y="186" class="at">- scoreSheetFile : Path</text>
  <text x="70" y="204" class="at">- starterDirectory : Path</text>
  <text x="70" y="222" class="at">- testersDirectory : Path</text>

  <rect x="200" y="300" width="180" height="78" class="cls"/>
  <text x="290" y="322" class="cname" text-anchor="middle">Section</text>
  <line x1="200" y1="330" x2="380" y2="330" class="sep"/>
  <text x="210" y="350" class="at">- moduleCode : String</text>
  <text x="210" y="368" class="at">- sectionCode : String</text>

  <rect x="60" y="440" width="320" height="96" class="cls"/>
  <text x="220" y="462" class="cname" text-anchor="middle">Assessment</text>
  <line x1="60" y1="470" x2="380" y2="470" class="sep"/>
  <text x="70" y="490" class="at">- name : String</text>
  <text x="70" y="508" class="at">- moduleCode : String</text>
  <text x="70" y="526" class="at">- placeholderFolderNames : List&lt;String&gt;</text>

  <rect x="60" y="640" width="320" height="114" class="cls"/>
  <text x="220" y="662" class="cname" text-anchor="middle">Question</text>
  <line x1="60" y1="670" x2="380" y2="670" class="sep"/>
  <text x="70" y="690" class="at">- id : String</text>
  <text x="70" y="708" class="at">- folderName : String</text>
  <text x="70" y="726" class="at">- fileName : String</text>
  <text x="70" y="744" class="at">- maxScore : double</text>

  <!-- Column B -->
  <rect x="520" y="100" width="340" height="150" class="cls"/>
  <text x="690" y="122" class="cname" text-anchor="middle">Submission</text>
  <line x1="520" y1="130" x2="860" y2="130" class="sep"/>
  <text x="530" y="150" class="at">- username : String</text>
  <text x="530" y="168" class="at">- originalPath : Path</text>
  <text x="530" y="186" class="at">- workingCopyPath : Path</text>
  <text x="530" y="204" class="at">- ingestFailure : String</text>
  <text x="530" y="222" class="at">- status : SubmissionStatus</text>
  <text x="530" y="240" class="at">- rejectedFixes : List&lt;String&gt;</text>

  <rect x="520" y="400" width="340" height="114" class="cls"/>
  <text x="690" y="422" class="cname" text-anchor="middle">QuestionResult</text>
  <line x1="520" y1="430" x2="860" y2="430" class="sep"/>
  <text x="530" y="450" class="at">- score : double</text>
  <text x="530" y="468" class="at">- compiled : boolean</text>
  <text x="530" y="486" class="at">- timedOut : boolean</text>
  <text x="530" y="504" class="at">- output : String</text>

  <rect x="520" y="640" width="340" height="96" class="cls"/>
  <text x="690" y="662" class="cname" text-anchor="middle">TestCaseResult</text>
  <line x1="520" y1="670" x2="860" y2="670" class="sep"/>
  <text x="530" y="690" class="at">- testNumber : int</text>
  <text x="530" y="708" class="at">- passed : boolean</text>
  <text x="530" y="726" class="at">- detail : String</text>

  <!-- Column C -->
  <rect x="1000" y="100" width="320" height="132" class="cls"/>
  <text x="1160" y="122" class="cname" text-anchor="middle">Student</text>
  <line x1="1000" y1="130" x2="1320" y2="130" class="sep"/>
  <text x="1010" y="150" class="at">- orgDefinedId : String</text>
  <text x="1010" y="168" class="at">- username : String</text>
  <text x="1010" y="186" class="at">- lastName : String</text>
  <text x="1010" y="204" class="at">- firstName : String</text>
  <text x="1010" y="222" class="at">- email : String</text>

  <rect x="1000" y="300" width="320" height="168" class="cls"/>
  <text x="1160" y="322" class="cname" text-anchor="middle">Anomaly</text>
  <line x1="1000" y1="330" x2="1320" y2="330" class="sep"/>
  <text x="1010" y="350" class="at">- id : String</text>
  <text x="1010" y="368" class="at">- type : AnomalyType</text>
  <text x="1010" y="386" class="at">- severity : Severity</text>
  <text x="1010" y="404" class="at">- username : String</text>
  <text x="1010" y="422" class="at">- message : String</text>
  <text x="1010" y="440" class="at">- suggestedAction : String</text>
  <text x="1010" y="458" class="at">- fixStatus : FixStatus</text>

  <rect x="1000" y="540" width="150" height="110" class="enum"/>
  <text x="1075" y="556" class="stereo" text-anchor="middle">«enumeration»</text>
  <text x="1075" y="574" class="cname" text-anchor="middle">Severity</text>
  <line x1="1000" y1="584" x2="1150" y2="584" class="sep"/>
  <text x="1010" y="603" class="at">INFO</text>
  <text x="1010" y="621" class="at">WARNING</text>
  <text x="1010" y="639" class="at">ERROR</text>

  <rect x="1170" y="540" width="150" height="146" class="enum"/>
  <text x="1245" y="556" class="stereo" text-anchor="middle">«enumeration»</text>
  <text x="1245" y="574" class="cname" text-anchor="middle">FixStatus</text>
  <line x1="1170" y1="584" x2="1320" y2="584" class="sep"/>
  <text x="1180" y="603" class="at">NOT_FIXABLE</text>
  <text x="1180" y="621" class="at">PENDING</text>
  <text x="1180" y="639" class="at">APPLIED</text>
  <text x="1180" y="657" class="at">APPROVED</text>
  <text x="1180" y="675" class="at">UNDONE</text>

  <rect x="1000" y="720" width="170" height="146" class="enum"/>
  <text x="1085" y="736" class="stereo" text-anchor="middle">«enumeration»</text>
  <text x="1085" y="754" class="cname" text-anchor="middle">SubmissionStatus</text>
  <line x1="1000" y1="764" x2="1170" y2="764" class="sep"/>
  <text x="1010" y="783" class="at">PENDING</text>
  <text x="1010" y="801" class="at">RUNNING</text>
  <text x="1010" y="819" class="at">GRADED</text>
  <text x="1010" y="837" class="at">FAILED</text>
  <text x="1010" y="855" class="at">CANCELLED</text>

  <!-- Column D -->
  <rect x="1400" y="100" width="320" height="380" class="enum"/>
  <text x="1560" y="116" class="stereo" text-anchor="middle">«enumeration»</text>
  <text x="1560" y="134" class="cname" text-anchor="middle">AnomalyType</text>
  <line x1="1400" y1="144" x2="1720" y2="144" class="sep"/>
  <text x="1410" y="163" class="at">MISSING_WRAPPER_FOLDER</text>
  <text x="1410" y="181" class="at">WRONG_FOLDER_NAME</text>
  <text x="1410" y="199" class="at">MISSING_QUESTION_FOLDER</text>
  <text x="1410" y="217" class="at">MISSING_FILE</text>
  <text x="1410" y="235" class="at">WRONG_FILE_NAME</text>
  <text x="1410" y="253" class="at">MISSING_HEADER_NAME</text>
  <text x="1410" y="271" class="at">WRONG_ENCODING</text>
  <text x="1410" y="289" class="at">UNKNOWN_STUDENT</text>
  <text x="1410" y="307" class="at">INVALID_ARCHIVE</text>
  <text x="1410" y="325" class="at">DUPLICATE_SUBMISSION</text>
  <text x="1410" y="343" class="at">COMPILE_ERROR</text>
  <text x="1410" y="361" class="at">TIMEOUT</text>
  <text x="1410" y="379" class="at">RUNTIME_ERROR</text>
  <text x="1410" y="397" class="at">UNTOUCHED_STARTER</text>
  <text x="1410" y="415" class="at">EMPTY_ANSWER</text>
  <text x="1410" y="433" class="at">HARD_CODED_ANSWER</text>
  <text x="1410" y="451" class="at">SIMILAR_CODE</text>
  <text x="1410" y="469" class="at">INTERNAL_ERROR</text>

  <rect x="1400" y="540" width="320" height="150" class="cls"/>
  <text x="1560" y="562" class="cname" text-anchor="middle">ScoreAdjustment</text>
  <line x1="1400" y1="570" x2="1720" y2="570" class="sep"/>
  <text x="1410" y="590" class="at">- username : String</text>
  <text x="1410" y="608" class="at">- questionId : String</text>
  <text x="1410" y="626" class="at">- previousScore : double</text>
  <text x="1410" y="644" class="at">- newScore : double</text>
  <text x="1410" y="662" class="at">- reason : String</text>
  <text x="1410" y="680" class="at">- savedAt : LocalDateTime</text>
  <text x="1400" y="710" class="note">A mark the instructor changed by hand, with the</text>
  <text x="1400" y="727" class="note">reason. Saved per run; it names the student and</text>
  <text x="1400" y="744" class="note">question by username and question id.</text>

  <!-- Associations -->
  <line x1="380" y1="150" x2="518" y2="150" class="line" marker-start="url(#comp)" marker-end="url(#nav)"/>
  <text x="402" y="142" class="role">submissions</text>
  <text x="510" y="170" class="mult" text-anchor="end">0..*</text>

  <line x1="100" y1="232" x2="100" y2="438" class="line" marker-end="url(#nav)"/>
  <text x="108" y="430" class="mult">1</text>

  <line x1="290" y1="232" x2="290" y2="298" class="line" marker-end="url(#nav)"/>
  <text x="298" y="292" class="mult">1</text>

  <line x1="520" y1="240" x2="382" y2="340" class="line" marker-end="url(#nav)"/>
  <text x="392" y="322" class="mult">1</text>

  <line x1="860" y1="150" x2="998" y2="150" class="line" marker-end="url(#nav)"/>
  <text x="990" y="142" class="mult" text-anchor="end">0..1</text>
  <text x="878" y="170" class="role">null if not on the roster</text>

  <line x1="860" y1="230" x2="998" y2="330" class="line" marker-start="url(#comp)" marker-end="url(#nav)"/>
  <text x="990" y="346" class="mult" text-anchor="end">0..*</text>
  <text x="900" y="252" class="role">anomalies</text>

  <line x1="690" y1="250" x2="690" y2="398" class="line" marker-start="url(#comp)" marker-end="url(#nav)"/>
  <text x="698" y="390" class="mult">0..*</text>
  <text x="698" y="290" class="role">questionResults</text>

  <line x1="690" y1="514" x2="690" y2="638" class="line" marker-start="url(#comp)" marker-end="url(#nav)"/>
  <text x="698" y="630" class="mult">0..*</text>
  <text x="698" y="554" class="role">testCaseResults</text>

  <line x1="520" y1="480" x2="382" y2="690" class="line" marker-end="url(#nav)"/>
  <text x="392" y="712" class="mult">1</text>

  <line x1="220" y1="536" x2="220" y2="638" class="line" marker-start="url(#comp)" marker-end="url(#nav)"/>
  <text x="228" y="630" class="mult">1..*</text>
  <text x="228" y="576" class="role">questions</text>

  <!-- Notes -->
  <path d="M 60 800 H 840 L 860 820 V 960 H 60 Z" fill="#fffbe6" stroke="#9a6700" stroke-width="1.2"/>
  <path d="M 840 800 V 820 H 860" fill="none" stroke="#9a6700" stroke-width="1.2"/>
  <text x="78" y="828" font-size="14" font-weight="700" fill="#24292f">Reading the model</text>
  <text x="78" y="854" class="at">One GradingRun is one batch for a section: it holds one Submission per student who uploaded.</text>
  <text x="78" y="876" class="at">Each Submission keeps a QuestionResult per question, with the result of every test case.</text>
  <text x="78" y="898" class="at">Mistakes found on the way are kept as Anomaly objects on the Submission, so one bad</text>
  <text x="78" y="920" class="at">upload is reported without stopping the batch. The enums are used as attribute types.</text>
  <text x="78" y="942" class="at">A Submission with no Student is an upload whose username is not on the score sheet.</text>
</svg>
