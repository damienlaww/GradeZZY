# ======================================================================
# GradeZZY configuration
#
# Every setting the application uses lives in this file and is read by
# gradezzy.config.AppConfig. The names are listed in ConfigKeys.java.
# Paths are relative to the folder that holds compile.sh and run.sh.
# Use forward slashes in paths on both Windows and macOS.
# ======================================================================

# ---------------------------------------------------------------- course
# Course codes the instructor can pick from, separated by commas. The
# first one is used when no module is chosen. Each module has the
# sections below, unless it is listed under own.sections.only, plus its
# own sections from app.section.codes.by.module.
app.module.codes=CS102
# Sections the instructor can pick from when uploading a batch.
app.section.codes=G1,G2,G3,G4,G5,G6,G7,G8,G9,G10
# Sections of one module only, such as CS102:G5|G6;IS442:G1. Home adds
# one here when "This module only" is chosen.
app.section.codes.by.module=
# Modules that have only their own sections, such as one added on Home.
app.module.codes.own.sections.only=

# ----------------------------------------------------------------- paths
# Folder of submissions graded by the console entry point (run.sh console).
# The window lets the instructor pick files instead.
paths.submissions.dir=samples/student-submission
# Folder holding the uploaded tester files and their data files.
paths.testers.dir=samples/lab-test-2/Tester-Files
# The provided score sheet: used as the roster and as the export template.
paths.score.sheet.file=samples/IS442-ScoreSheet.csv
# The score sheet of each section, such as CS102/G1=Test Data/G1.csv.
# A section with none uses the score sheet above. Set them in Settings.
paths.score.sheet.by.section=
# Folder holding the starter files given to students.
paths.starter.dir=samples/lab-test-2/RenameToYourUsername
# Folder holding the model answers, laid out like the starter folder
# (Q1/Q1.java and so on). Leave it empty to skip the two checks that use
# it: the tester strength check and the random inputs check.
paths.model.answers.dir=
# Folder where working copies are created. Originals are never changed.
paths.working.dir=workspace/working
# Folder where exports (CSV, JSON, reports) are written.
paths.output.dir=workspace/output
# Export folders of single modules or sections, such as
# CS102/G1=workspace/g1-exports;IS442=workspace/is442. Others use the
# folder above. Set them in Settings, under Files and folders.
paths.output.dir.by.section=
# Folder where database backups are kept.
paths.backup.dir=workspace/backup
# Folder where saved assessments are kept, one file each. Choosing an
# assessment in the window copies its settings into this file.
paths.assessments.dir=workspace/assessments
# File where the submissions chosen for each section are kept, so Set up
# lists them again after GradeZZY is closed and opened.
paths.chosen.submissions.file=workspace/chosen-submissions.properties

# ---------------------------------------------------------------- ingest
# Regular expression for the text in front of the username in a zip file
# name. The sample files are named 2023-2024-<username>.zip.
ingest.zip.name.prefix.pattern=^[0-9]{4}-[0-9]{4}-
# File and folder names ignored inside a submission.
ingest.ignored.file.names=.DS_Store,__MACOSX,Thumbs.db
# Largest unzipped size accepted for one submission, in megabytes.
ingest.max.zip.size.mb=50
# Largest number of entries accepted in one zip file.
ingest.max.zip.entries=2000

# ------------------------------------------------------------ assessment
# Name of the assessment being graded.
assessment.name=Lab Test 2
# Question ids, in order. Each id needs the two settings below it.
assessment.question.ids=Q1a,Q1b,Q2a,Q2b,Q3
# For each question: its folder and its source file. Its maximum score is
# not set here: it is the sum of the "score += <number>" lines in its
# tester (Q1aTester.java and so on).
assessment.question.Q1a.folder=Q1
assessment.question.Q1a.file=Q1a.java
assessment.question.Q1b.folder=Q1
assessment.question.Q1b.file=Q1b.java
assessment.question.Q2a.folder=Q2
assessment.question.Q2a.file=Q2a.java
assessment.question.Q2b.folder=Q2
assessment.question.Q2b.file=Q2b.java
assessment.question.Q3.folder=Q3
assessment.question.Q3.file=Q3.java
# Starter folder names that mean the student forgot to rename the folder.
assessment.placeholder.folder.names=RenameToYourUsername
# Compiled files given to students without source. They are kept when the
# students' own .class files are removed from the working copy. A line
# that ends with a backslash continues on the next line.
assessment.provided.class.files=Book.class,Gadget.class,InvalidDataException.class,Item.class
# Data files the testers read. They are copied next to each tester.
assessment.tester.data.files=badorderstester.txt,orderstester.txt,tietester.txt

# ------------------------------------------------------------ validation
# Label in front of the student name in a file header comment.
validation.header.name.label=Name:
# Label in front of the student email in a file header comment.
validation.header.email.label=Email ID:
# How many lines at the top of a file are searched for the header.
validation.header.scan.lines=10

# ------------------------------------------------------------------- fix
# true: fixes are applied to the working copy automatically and wait for
# Approve or Undo in the anomaly log. false: anomalies are only reported.
fix.auto.apply.enabled=true

# ------------------------------------------------------------- execution
# Commands used to compile and run. Both must be on the PATH.
exec.javac.command=javac
exec.java.command=java
# Time limit in seconds for compiling one question folder.
exec.compile.timeout.seconds=30
# Time limit in seconds for one tester run. A tester that runs longer is
# stopped and reported as a timeout.
exec.run.timeout.seconds=10
# How many submissions may be graded at the same time.
exec.thread.count=4
# Longest program output kept, in characters, to protect memory.
exec.max.output.characters=100000
# Most memory, in MB, one tester run may use for its objects, so student
# code cannot take the computer's memory. 0 means no limit.
exec.max.memory.mb=256
# How many times a question's tester is run again after a case hangs
# or crashes it.
# Each rerun can take the whole time limit; after the last one, the
# cases not yet run are flagged for the instructor to check by hand.
exec.max.hang.reruns=2

# --------------------------------------------------------------- grading
# Text added to a question id to form its tester class (Q1a -> Q1aTester).
grading.tester.class.suffix=Tester
# Line the sample testers print when a test case passes.
grading.pass.marker=Passed
# Start of the line the sample testers print when a test case fails.
grading.fail.marker=Failed
# Start of the line a tester prints before each test case.
grading.test.header.marker=Test

# --------------------------------------------------------- model answers
# These checks run only when paths.model.answers.dir is set.
# Whether the console checks each tester before grading: it makes broken
# copies of the model answer (a < made <=, a + made -, a line removed)
# and runs the tester on each. A copy that still gets full marks shows
# something the tester never checks. "run.sh console --testers" runs
# only this check.
tester.strength.enabled=true
# The most broken copies made of each question's model answer.
tester.strength.max.copies=40
# Time limit, in seconds, for the tester on one broken copy. A copy that
# runs longer counts as caught, since a real answer like it would not
# finish either.
tester.strength.timeout.seconds=5
# Whether each student's methods are also called with random inputs and
# edge cases (0, negatives, empty text, extremes) after grading, and any
# answer that differs from the model answer's is flagged. Marks never
# change. Only static methods whose parameters are numbers, text, true or
# false, or arrays and ArrayLists of these are called.
random.inputs.enabled=true
# How many inputs each such method is called with.
random.inputs.count=200

# ------------------------------------------------------------- detection
# Each detector only flags a submission for review. Marks never change.
detection.untouched.enabled=true
detection.empty.enabled=true
detection.hardcoded.enabled=true

# ------------------------------------------------------------ plagiarism
# Whether the similarity check runs after grading.
plagiarism.enabled=true
# Similarity from 0 to 1 at which a pair of submissions is flagged.
plagiarism.similarity.threshold=0.80
# How answers are compared: trigrams (the first version: runs of three
# tokens as written) or winnowing (rename-proof fingerprints, so renamed
# variables and moved methods still match, but honest answers with the
# same structure match too).
plagiarism.algorithm=trigrams

# ---------------------------------------------------------------- export
# Export formats offered by default.
export.formats=csv,json
# Line ending of the score sheet CSV: CRLF (as provided) or LF.
export.csv.line.ending=CRLF
# Character in front of the OrgDefinedId and Username values.
export.csv.id.prefix=#
# Value of the End-of-Line Indicator column.
export.csv.end.of.line.marker=#

# ------------------------------------------------------------ statistics
# Percentage of the maximum mark that counts as a pass.
stats.pass.mark.percent=50
# Width of each mark band in the chart, as a percentage of the maximum.
stats.mark.band.width.percent=10

# -------------------------------------------------------------- database
# Whether grading state is saved to SQLite (history, resume, audit log).
database.enabled=true
# Location of the SQLite database file.
database.file=workspace/gradezzy.db
# How many backups are kept before the oldest is deleted.
database.backup.keep.count=5

# ----------------------------------------------------------------- audit
# Whether instructor actions (approve, undo, export) are logged.
audit.enabled=true

# -------------------------------------------------------- user interface
# Theme of the window: light or dark.
ui.theme=light
# Starting size of the window, in pixels.
ui.window.width=1200
ui.window.height=800
# Whether subtle animations are shown.
ui.animations.enabled=true
